<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piranhalab - Laboratorio de exploración</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* Reset y estilos base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f8f8;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Contenedor principal */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        /* Logo */
        .logo {
            margin-bottom: 30px;
            width: 150px;
            height: 150px;
        }
        
        .logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        /* Títulos */
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.5rem;
            font-weight: 300;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        
        h2 {
            font-family: 'Inter', sans-serif;
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 40px;
            max-width: 600px;
            color: #666;
            line-height: 1.4;
        }
        
        /* Footer */
        footer {
            padding: 20px;
            text-align: center;
            color: #999;
            font-size: 0.9rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            h2 {
                font-size: 1.2rem;
            }
            
            .logo {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo - reemplazar con ruta correcta a tu imagen -->
        <div class="logo">
            <img src="img/plab-logo.png" alt="PiranhaLab Logo">
        </div>
        
        <h1>PiranhaLab</h1>
        <h2>Laboratorio de exploración entre arte, tecnología y educación</h2>
    </div>
    
    <footer>
        <p><*(((-{</p>
    </footer>
</body>
</html>
